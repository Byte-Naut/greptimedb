[package]
name = "blink-tree-poc"
version = "0.1.0"
edition = "2024"
publish = false

# Independent test harness: no GreptimeDB service or workspace build is needed.
[workspace]

[dev-dependencies]
opendal = { version = "=0.59.4", default-features = false, features = ["services-memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }
